<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zemu.az - Alqı-Satqı Platforması</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Üst Panel -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Zemu<span>.az</span></a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Zemu-da axtarış edin...">
                <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <a href="add-elan.html" class="add-elan-btn"><i class="fa-solid fa-circle-plus"></i> ELAN ƏLAVƏ ET</a>
        </div>
    </header>

    <!-- Kateqoriya Menyusu -->
    <section class="categories container">
        <div class="cat-item">
            <div class="cat-icon"><i class="fa-solid fa-bolt"></i></div>
            <span>Endirimlər</span>
        </div>
        <div class="cat-item">
            <div class="cat-icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
            <span>Telefonlar</span>
        </div>
        <div class="cat-item">
            <div class="cat-icon"><i class="fa-solid fa-car"></i></div>
            <span>Nəqliyyat</span>
        </div>
        <div class="cat-item">
            <div class="cat-icon"><i class="fa-solid fa-shirt"></i></div>
            <span>Geyim</span>
        </div>
        <div class="cat-item">
            <div class="cat-icon"><i class="fa-solid fa-couch"></i></div>
            <span>Ev əşyaları</span>
        </div>
    </section>

    <!-- Əsas Məhsullar Şəbəkəsi -->
    <main class="container">
        <h2 class="section-title">Son Elanlar</h2>
        <div class="products-grid" id="productsGrid">
            <!-- Elanlar JavaScript ilə yüklənəcək -->
        </div>
    </main>

    <!-- Mobil Alt Menyusu -->
    <nav class="bottom-nav">
        <a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>ƏSAS</span></a>
        <a href="#"><i class="fa-regular fa-heart"></i><span>SEÇİLMİŞLƏR</span></a>
        <a href="add-elan.html" class="plus-icon"><i class="fa-solid fa-circle-plus"></i><span>YENİ</span></a>
        <a href="login.html" id="navAuthLink"><i class="fa-regular fa-user"></i><span>GİRİŞ</span></a>
    </nav>

    <!-- Supabase JS Library və Əsas Skript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
            </html>
